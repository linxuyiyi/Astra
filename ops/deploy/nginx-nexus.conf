server {
  listen 80;
  server_name _;
  root /opt/nexus/web/nexus/dist;
  index index.html;


  # 官方 AgentScope Web UI：静态产物在 /agentscope-ui/，同源 API 代理到 AgentScope。
  location = /agentscope-ui { return 308 /agentscope-ui/; }
  location /agentscope-ui/assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }
  location /agentscope-ui/ {
    try_files $uri $uri/ /agentscope-ui/index.html;
  }
  location = /agentscope-api { return 308 /agentscope-api/; }
  location /agentscope-api/ {
    proxy_pass http://127.0.0.1:18000/;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /api/v1/ {
    proxy_pass http://127.0.0.1:18120;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_read_timeout 3600s;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # 上游 SSO 写入 X-Remote-User。这里覆盖浏览器自带的 X-Verified-UID。
    proxy_set_header X-Verified-UID $http_x_remote_user;
  }

  location /api/ {
    proxy_pass http://127.0.0.1:18100;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_read_timeout 3600s;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Gateway data plane (nexus-gateway): OpenAI-compatible /v1.
  location /v1/ {
    proxy_pass http://127.0.0.1:18110;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location = /docs {
    proxy_pass http://127.0.0.1:18100/docs;
    proxy_set_header Host $host;
  }

  location = /openapi.json {
    proxy_pass http://127.0.0.1:18100/openapi.json;
    proxy_set_header Host $host;
  }

  # index.html names the hashed assets, so it has to revalidate. The assets stay immutable.
  location ~ ^/opencode-workspace/[^/]+/index\.html$ {
    add_header Cache-Control "no-cache";
    try_files $uri =404;
  }

  location /opencode-workspace/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
