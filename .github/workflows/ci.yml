name: Nexus CI

on:
  push:
  pull_request:

jobs:
  nexus-api:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install unified service
        run: python -m pip install -e 'services/nexus-api[dev]'
      - name: Lint, test, and migrate
        working-directory: services/nexus-api
        run: |
          python -m ruff check app nexus_api tests
          python -m pytest
          python -m alembic upgrade head

  agent-service:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install and test Agent Service
        run: |
          python -m pip install -r services/agent-service/requirements.txt
          python -m pip install pytest
          PYTHONPATH=services/agent-service python -m pytest services/agent-service/tests

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: services/nexus-api/web/package-lock.json
      - name: Type-check and build
        working-directory: services/nexus-api/web
        run: |
          npm ci
          npm run type-check
          npm run build
