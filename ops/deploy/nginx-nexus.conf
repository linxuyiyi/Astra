server {
  listen 80;
  server_name _;
  root /opt/nexus/services/nexus-api/web/dist;
  index index.html;


  # 官方 AgentScope Web UI：静态产物在 /agentscope-ui/，同源 API 代理到 AgentScope。
  location = /agentscope-ui { return 308 /agentscope-ui/; }
  location /agentscope-ui/assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }
  location /agentscope-ui/ {
    try_files $uri $uri/ /agentscope-ui/index.html;
  }
  # Nexus 聊天岛：自建 React 子应用（vendored AgentScope 聊天组件），独立于官方管理 UI。
  location = /nexus-chat { return 308 /nexus-chat/; }
  location /nexus-chat/assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }
  location /nexus-chat/ {
    try_files $uri $uri/ /nexus-chat/index.html;
  }
  location = /agentscope-api { return 308 /agentscope-api/; }
  location /agentscope-api/ {
    proxy_pass http://127.0.0.1:18000/;
    proxy_http_version 1.1;
    client_max_body_size 64m;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /api/v1/ {
    proxy_pass http://127.0.0.1:18120;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_read_timeout 3600s;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # 上游 SSO 写入 X-Remote-User。这里覆盖浏览器自带的 X-Verified-UID。
    proxy_set_header X-Verified-UID $http_x_remote_user;
  }

  # Worker 控制通道须显式转发 Upgrade；普通 API 保持原有 HTTP/SSE 行为。
  location = /api/worker-gateway/connect {
    proxy_pass http://127.0.0.1:18120;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
  }

  location /api/ {
    client_max_body_size 13m;
    proxy_pass http://127.0.0.1:18120;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_read_timeout 3600s;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # /api/asr/transcribe 由统一服务读取语音路由后调用网关。

  # Gateway data plane (nexus-gateway): OpenAI-compatible /v1.
  location /v1/ {
    client_max_body_size 20m;
    proxy_pass http://127.0.0.1:18110;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location = /docs {
    proxy_pass http://127.0.0.1:18120/docs;
    proxy_set_header Host $host;
  }

  location = /openapi.json {
    proxy_pass http://127.0.0.1:18120/openapi.json;
    proxy_set_header Host $host;
  }

  # index.html names the hashed assets, so it has to revalidate. The assets stay immutable.
  location ~ ^/opencode-workspace/[^/]+/index\.html$ {
    add_header Cache-Control "no-cache";
    try_files $uri =404;
  }

  location /opencode-workspace/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
