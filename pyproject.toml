[project]
name = "nexus"
version = "0.1.0"
description = "Nexus 数字员工系统：AgentScope 服务适配层与业务后端。"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "agentscope[service,storage-sql]==2.0.10",
    "aiosqlite>=0.20",
    "fastapi>=0.115",
    "httpx>=0.27",
    "python-dotenv>=1.0.1",
    "sqlalchemy[asyncio]>=2.0",
    "uvicorn>=0.30",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

[project.optional-dependencies]
# 可选：开启知识库时需要的官方持久化向量库后端（AGENTSCOPE_KNOWLEDGE_ENABLED）。
knowledge = ["qdrant-client>=1.9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "agent-service/nexus_agent_service",
    "backend/nexus_backend",
]

[tool.pytest.ini_options]
testpaths = ["tests/agent_service", "tests/backend"]
pythonpath = ["agent-service", "backend"]
asyncio_mode = "auto"
