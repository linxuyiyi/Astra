[project]
name = "nr-version-mcp"
version = "0.1.0"
description = "NR 测试系统产品版本查询 MCP（只读）"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
  "httpx>=0.28,<1",
  "mcp>=2,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "ruff>=0.12,<1",
]

[project.scripts]
nr-version-mcp = "nr_version_mcp.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nr_version_mcp"]

[tool.pytest.ini_options]
pythonpath = ["src"]
python_files = ["test_*.py"]
addopts = "-ra --strict-markers"
markers = [
  "live: 需要真实 Django 服务与真实会话的端到端测试",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.format]
quote-style = "double"
