# Nexus v1.4.7 的 OpenSpec 规划约束。
#
# 这里是产物规则的唯一事实源，AGENTS.md 只保留项目级硬规则。
# 内置 CLI（.opencode/tools/openspec.mjs）只解析 schema / context / rules 三个字段，
# 写入其他顶层键会被静默忽略；rules 的键必须是当前 schema 的合法 artifact ID
# （spec-driven 下为 proposal / specs / design / tasks）。

schema: spec-driven

context: |
  使用简体中文编写 proposal、spec、design 和 tasks；技术标识符保留原文。
  本分支的产品是 Nexus v1.4.7：Vue 3 + Element Plus 前端、Python HTTP API、AgentScope 2.0.10 Agent Service。
  Agent、Session、Skill、Knowledge 与对话记忆只存在于 AgentScope；Nexus 不平行实现，也不提供模型配置界面。
  一位数字员工是一个独立 Agent。对话绑定 Session。对等同事联系使用自定义工具 contact_employee（inbox + wakeup + MessageBus），不使用 Agent Team（Leader→Worker），也不脚本化多 Agent 回复。
  新代码放在 services/nexus-api：nexus_api/（对话、员工目录）、app/（Task、Run、Employee、Runtime、网关控制面、图书馆）、web/（前端）与 chat-island/（聊天岛）。历史产品文档在 docs/archive，不作为当前实现位置。
  openspec/specs/ 中现存 capability 是 Astra 历史契约。Nexus change 只新增自己的 capability，不修改这些历史 spec。
  保留现有 OpenSpec 工作流与 Superpowers 集成；Superpowers 只使用仓库内已存在的 skill，不虚构缺失项。
  本项目只对行为契约、跨模块架构、数据模型与权限变更使用 OpenSpec；小修复直接走代码及针对性验证。

rules:
  proposal:
    - "用简短段落交代问题、变更范围、非目标与影响；不得重述整个项目背景。"
    - "只列真实新增或修改的 capability；不因代码重构虚构新的业务需求。"
  specs:
    - "只描述外部可观察的需求和可验证场景；每项 Requirement 至少一个 WHEN/THEN Scenario。"
    - "优先修改已有 capability；Nexus 不修改 openspec/specs/ 中的 Astra 历史契约，新行为写成新 capability。"
    - "不写类名、函数名、工具选型或具体实施步骤；不对既有要求降级。"
  design:
    - "只记录必要的设计决策、被舍弃方案和影响；单模块变更保持极简，不重复 proposal 的动机。"
    - "跨 AgentScope、持久化或权限时，写明状态事实源与 Nexus 不复制的边界。"
  tasks:
    - "与 spec 场景对应，按依赖分组；每项有明确的完成和验证标准。"
    - "只保留一个 tasks.md；不把每次工具调用、每次提交或每个文件阅读拆为任务。"
    - "优先先做针对性测试，再扩大回归；注明真实环境无法验证的项目。"
