# Nexus ASR Server — Nginx proxy example.
# Add limit_req_zone / upstream to the http{} block, and the locations to the
# existing Nexus server{} block (the one that already enforces login).

# ---- http{} ----
limit_req_zone $binary_remote_addr zone=nexus_asr:10m rate=30r/m;

upstream nexus_asr {
    server 127.0.0.1:19899;
    keepalive 8;
}

# ---- server{} ----
# Keep the existing Nexus authentication. If Nexus uses auth_request, add:
#   auth_request /api/auth/verify;
# to the locations below (or rely on the enclosing /api location if it already
# applies auth). Do not expose the ASR service directly.
location = /api/asr/transcribe {
    limit_req zone=nexus_asr burst=5 nodelay;
    client_max_body_size 12m;

    proxy_pass http://nexus_asr;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $request_id;

    proxy_connect_timeout 5s;
    proxy_send_timeout 70s;
    proxy_read_timeout 70s;
    proxy_buffering off;
    proxy_request_buffering off;
}

location = /api/asr/models {
    proxy_pass http://nexus_asr;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 10s;
}

# Health: the service binds 127.0.0.1, so monitor it directly:
#   curl -fsS http://127.0.0.1:19899/health
# Do not add a public /health location here; Nexus may already own that path.

