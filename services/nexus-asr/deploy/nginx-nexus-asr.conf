# Nexus v1.4.8：语音输入不得直接代理到本机 ASR。
# 使用 ops/deploy/nginx-nexus.conf 的统一 /api/ 与 /v1/ 入口，并保留公司登录鉴权。
# 如已有精确 /api/asr/transcribe 或 /api/asr/models location，请删除旧直连配置。
# /api/asr/transcribe → Nexus API → Gateway /v1/audio/transcriptions → ASR API。
# 通过网关节点配置根地址与 ASR 探测、模型路由选择 ASR、保存数字员工语音输入路由。
# 详见 ../docs/nexus-integration.md；不要将无认证的 ASR 端口公开。
