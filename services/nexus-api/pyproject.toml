[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "nexus-api"
version = "1.4.8"
description = "Nexus 单一服务：员工对话、任务、Runtime、Worker、网关与数字图书馆"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.13,<2",
  "aiosqlite>=0.20,<1",
  "asyncmy>=0.2.9,<1",
  "celery[redis]>=5.4,<6",
  "cryptography>=43,<51",
  "fastapi>=0.115,<1",
  "greenlet>=3.2,<4",
  "httpx>=0.27,<1",
  "mcp>=2.1,<3",
  "paramiko>=3.4,<4",
  "psutil==7.2.2",
  "pydantic>=2,<3",
  "pydantic-settings>=2.5,<3",
  "PyMySQL>=1.1,<2",
  "python-multipart>=0.0.9",
  "PyYAML>=6,<7",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dsh = [
  "agent-client-protocol==0.8.1",
]
dev = [
  "pytest>=8,<9",
  "pytest-asyncio>=0.24,<1",
  "pytest-cov>=5,<7",
  "ruff>=0.6,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["app", "nexus_api"]

[project.scripts]
astra-library-mcp = "app.mcp_server:main"
astra-task-mcp = "app.task_mcp:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]
