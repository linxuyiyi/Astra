[project]
name = "nr-version-mcp"
version = "0.1.0"
description = "NR 测试系统产品版本查询 MCP"
requires-python = ">=3.10"
dependencies = [
  "mcp>=1.30,<2",
  "httpx>=0.27,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "ruff>=0.12,<1",
]
demo = [
  "celery[redis]>=5.6.3,<5.7",
  "django>=5.2,<5.3",
  "djangorestframework>=3.16,<3.17",
]

[project.scripts]
nr-version-mcp = "nr_version_mcp.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nr_version_mcp"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
