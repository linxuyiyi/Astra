/* Skill resource selection: compact and searchable, no free-form Skill editing. */
.skill-picker{position:relative}
.skill-picker-trigger{width:100%;border:1px solid #d5e4d9;border-radius:10px;background:#fff;padding:11px 13px;font:inherit;color:#436853;display:flex;align-items:center;justify-content:space-between;text-align:left;cursor:pointer}
.skill-picker-trigger:hover,.skill-picker.open .skill-picker-trigger{border-color:#81c9a2}
.picker-chevron{font-size:19px;color:#78a18a;line-height:1}
.skill-picker-menu{display:none;position:relative;background:#fff;border:1px solid #d6e8dc;border-radius:12px;box-shadow:0 14px 35px #16482d19;padding:9px;margin-top:6px;z-index:2}
.skill-picker.open .skill-picker-menu{display:block}
.skill-picker-menu input[type="search"]{width:100%;box-sizing:border-box;border:1px solid #e0e9e2;border-radius:9px;padding:9px 11px;background:#f9fcfa;outline:0;color:#284d3a}
.skill-option-list{max-height:204px;overflow-y:auto;margin-top:6px}
.skill-option{display:flex;align-items:center;gap:9px;padding:10px 8px;border-radius:8px;cursor:pointer;font-size:12px}
.skill-option:hover{background:#edf8f1}.skill-option input{accent-color:#168357;width:15px;height:15px}
.skill-option span{font-weight:650;white-space:nowrap}.skill-option small{color:#89a595;margin-left:auto;font-size:10px;white-space:nowrap}
.skill-empty{padding:16px;text-align:center;color:#9ab1a1;font-size:12px}
.skill-selected{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.skill-selected:empty{display:none}
.skill-tag{font-size:11px;color:#286a4b;background:#edf8f2;border:1px solid #d5eade;padding:4px 7px 4px 9px;border-radius:7px;display:inline-flex;align-items:center;gap:7px}
.skill-tag button{background:transparent;border:0;font-size:16px;cursor:pointer;color:#61977b;padding:0 1px;line-height:1}
.skill-tag button:hover{color:#ce524e}

.thread-select{max-width:175px;min-width:114px;display:flex;justify-content:space-between;gap:8px}

// Files are kept in IndexedDB; localStorage holds only per-message attachment metadata.
// This is a local UI prototype, not an upload endpoint or model document parser.
const DRAFT_ATTACHMENTS={private:[],group:[]};
const ATTACHMENT_FALLBACK=new Map();
const ATTACHMENT_URLS=new Map();
const MAX_ATTACHMENT_BYTES=20*1024*1024;
const MAX_ATTACHMENT_COUNT=6;
let idbPromise;
function attachmentDB(){
  if(idbPromise)return idbPromise;
  idbPromise=new Promise(resolve=>{
    if(!window.indexedDB){resolve(null);return}
    try{
      const req=indexedDB.open('nexus_101_chat_attachments',1);
      req.onupgradeneeded=()=>{if(!req.result.objectStoreNames.contains('files'))req.result.createObjectStore('files')};
      req.onsuccess=()=>resolve(req.result);
      req.onerror=()=>resolve(null);
      req.onblocked=()=>resolve(null);
    }catch(e){resolve(null)}
  });
  return idbPromise;
}
async function putAttachment(id,file){
  const db=await attachmentDB();
  if(!db){ATTACHMENT_FALLBACK.set(id,file);return false}
  return new Promise(resolve=>{
    try{const tx=db.transaction('files','readwrite');tx.objectStore('files').put(file,id);tx.oncomplete=()=>resolve(true);tx.onerror=()=>{ATTACHMENT_FALLBACK.set(id,file);resolve(false)};tx.onabort=()=>{ATTACHMENT_FALLBACK.set(id,file);resolve(false)}}
    catch(e){ATTACHMENT_FALLBACK.set(id,file);resolve(false)}
  });
}
async function getAttachment(id){
  if(ATTACHMENT_FALLBACK.has(id))return ATTACHMENT_FALLBACK.get(id);
  const db=await attachmentDB();if(!db)return null;
  return new Promise(resolve=>{try{const tx=db.transaction('files','readonly');const req=tx.objectStore('files').get(id);req.onsuccess=()=>resolve(req.result||null);req.onerror=()=>resolve(null)}catch(e){resolve(null)}});
}
async function deleteAttachment(id){
  ATTACHMENT_FALLBACK.delete(id);
  const url=ATTACHMENT_URLS.get(id);if(url){URL.revokeObjectURL(url);ATTACHMENT_URLS.delete(id)}
  const db=await attachmentDB();if(!db)return;
  try{db.transaction('files','readwrite').objectStore('files').delete(id)}catch(e){}
}
function formatSize(n){return n<1024?'小于 1 KB':n<1024*1024?(n/1024).toFixed(0)+' KB':(n/1048576).toFixed(1)+' MB'}
function isPhoto(a){return a.type?.startsWith('image/')}
async function attachmentURL(id){
  if(ATTACHMENT_URLS.has(id))return ATTACHMENT_URLS.get(id);
  const file=await getAttachment(id);if(!file)return null;
  const url=URL.createObjectURL(file);ATTACHMENT_URLS.set(id,url);return url;
}
let draftBusy=0;
async function handleFiles(mode,items){
  const list=Array.from(items||[]);if(!list.length)return;
  const room=MAX_ATTACHMENT_COUNT-DRAFT_ATTACHMENTS[mode].length;
  if(room<=0){toast('每条消息最多添加 6 个附件');return}
  draftBusy++;
  try{
    let warned=false;
    for(const file of list.slice(0,room)){
      if(file.size>MAX_ATTACHMENT_BYTES){toast('单个附件不能超过 20 MB');continue}
      if(!file.size){toast('不能添加空文件');continue}
      const id='att_'+(crypto.randomUUID?.()||Date.now()+'_'+Math.random().toString(36).slice(2));
      const a={id,name:file.name||'未命名文件',type:file.type||'application/octet-stream',size:file.size};
      const saved=await putAttachment(id,file);
      if(!saved&&!warned){warned=true;toast('此浏览器无法持久保存附件，刷新页面后可能丢失')}
      DRAFT_ATTACHMENTS[mode].push(a);
    }
    if(list.length>room)toast('每条消息最多添加 6 个附件');
    renderDrafts(mode);
  }finally{draftBusy--}
}
function draftMarkup(a){return `<div class="draft-file" title="${esc(a.name)}">${isPhoto(a)?`<img data-attach-thumb="${esc(a.id)}" alt="">`:'<span class="draft-file-icon">▤</span>'}<div class="draft-file-info"><b>${esc(a.name)}</b><small>${formatSize(a.size)}</small></div><button class="remove-file" type="button" title="移除附件" data-remove-attachment="${esc(a.id)}" aria-label="移除 ${esc(a.name)}">×</button></div>`}

function wireAttachmentControls(){

    chat.addEventListener('dragleave',e=>{if(!chat.contains(e.relatedTarget))chat.classList.remove('drop-active')});
    chat.addEventListener('drop',e=>{e.preventDefault();chat.classList.remove('drop-active');handleFiles(mode,e.dataTransfer?.files)});
    el(mode+'Input').addEventListener('paste',e=>{
      const clips=Array.from(e.clipboardData?.items||[]).filter(x=>x.kind==='file').map(x=>x.getAsFile()).filter(Boolean);

    });
  }
  document.addEventListener('click',e=>{
    const remove=e.target.closest('[data-remove-attachment]');
    if(remove){const id=remove.dataset.removeAttachment,mode=remove.closest('#groupDrafts')?'group':'private';DRAFT_ATTACHMENTS[mode]=DRAFT_ATTACHMENTS[mode].filter(x=>x.id!==id);deleteAttachment(id);renderDrafts(mode);return}

  el('viewerClose').onclick=closeAttachmentViewer;
  el('attachmentViewer').onclick=e=>{if(e.target===el('attachmentViewer'))closeAttachmentViewer()};
}

function renderTeam(){ensureSelection();el('channelCount').textContent=state.channels.length;el('channelList').innerHTML=state.channels.map(c=>`<div class="rail-item ${state.currentChannel===c.id?'active':''}" data-channel="${esc(c.id)}"><span class="avatar ${c.id==='ch_failure'?'blue':'purple'}">☷</span><div><b>${esc(c.name)}</b><small>${c.members.filter(x=>getEmp(x)).length} 位数字员工 · ${esc(short(c.description))}</small></div></div>`).join('');const c=getChan();if(!c){el('groupTitle').textContent='暂无频道';el('groupMessages').innerHTML='<div class="chat-blank">创建一个团队讨论</div>';return}el('groupTitle').textContent='# '+c.name;el('groupSubtitle').textContent=c.description;el('groupMemberCount').textContent=`${c.members.filter(x=>getEmp(x)).length} 位员工`;el('groupMessages').innerHTML=c.messages.filter(m=>m.who!=='system'||!/(频道已建立|这是一条普通讨论消息)/.test(m.text)).map(msgMarkup).join('');hydrateSentThumbnails(el('groupMessages'));el('groupMembers').innerHTML=`<div class="member"><span class="avatar">👤</span><div><b>你</b><small>人类成员 · 发起人</small></div><span class="tag ash" style="margin-left:auto">在线</span></div>`+c.members.map(id=>getEmp(id)).filter(Boolean).map(e=>`<div class="member">${avatar(e)}<div><b>${esc(e.name)}</b><small>${esc(e.domain)}</small></div><span class="statusline ${e.enabled?'':'off'}"><i></i><span class="inline-note">${e.enabled?'启用':'禁用'}</span></span></div>`).join('');el('groupQuickTags').innerHTML=c.members.map(id=>getEmp(id)).filter(e=>e&&e.enabled).slice(0,3).map(e=>`<button class="chip" data-mention="${esc(e.id)}">@${esc(e.name)}</button>`).join('')+`<button class="chip" id="groupExplain">分析协同</button>`;scrollToBottom('groupMessages')}
function groupReply(e,q){if(/职责|负责|你是谁/.test(q))return `我是${e.name}，负责${e.domain}。${e.description}`;if(e.id==='emp_operations')return /异常|失败|版本|分析|防线/.test(q)?'我负责先梳理防线异常现象及原因。针对版本资源变化，我会优先排除环境与版本差异；如果确认需要框架适配，再请自动化工程师分析。当前没有执行日志，无法确认原因。':'防线运营会先确认执行现状和证据，再判断是否需要跨员工协助。';if(e.id==='emp_automation')return /异常|失败|版本|资源|OCL|脚本|适配|接口/.test(q)?'自动化侧需要核查资源解析、OCL 约束与脚本兼容性；若工具 API 契约也变化，需要测试工具工程师一起确认。仍需结合代码和日志确认。':'我负责自动化脚本开发、问题定位与维护。可以继续讨论具体技术细节。';if(e.id==='emp_tools')return '测试工具侧会重点核查接口契约、参数定义和兼容变更。需要版本差异或接口文档才能形成可靠结论。';return `请提供需要分析的信息。`}
function sendGroup(){const c=getChan();if(!c)return;const q=el('groupInput').value.trim(),attachments=DRAFT_ATTACHMENTS.group.slice();if((!q&&!attachments.length)||draftBusy)return;c.messages.push({who:'user',text:q,attachments,time:t()});el('groupInput').value='';clearDraft('group');const active=c.members.map(id=>getEmp(id)).filter(e=>e&&e.enabled);let targets=active.filter(e=>q.includes('@'+e.name));if(targets.length){targets=targets.slice(0,3);targets.forEach(e=>c.messages.push({who:e.id,text:groupReply(e,q),time:t(),demo:true}));if(targets.length===1&&/协助|一起|跨|失败|异常|版本|资源|接口|适配|联系/.test(q)){const first=targets[0];let next=first.id==='emp_operations'?active.find(e=>e.id==='emp_automation'):first.id==='emp_automation'?active.find(e=>e.id==='emp_tools'):null;if(next){c.messages.push({who:first.id,text:`这个问题涉及${next.domain}的职责，我联系${next.name}补充判断。`,time:t(),demo:true});c.messages.push({who:next.id,text:groupReply(next,q),time:t(),demo:true});}}}save();renderTeam()}
function insertMention(id){const e=getEmp(id);if(!e)return;const box=el('groupInput');const v=box.value.trim();box.value=(v?v+' ':'')+'@'+e.name+' ';box.focus();el('mentionBox').style.display='none'}
function mentionHint(){const box=el('groupInput'),m=box.value.match(/(?:^|\s)@([^\s]*)$/),hint=el('mentionBox');const c=getChan();if(!m||!c){hint.style.display='none';return}const matches=c.members.map(getEmp).filter(e=>e&&e.enabled&&e.name.includes(m[1]));hint.innerHTML=matches.map(e=>`<button class="mention-option" data-pick-mention="${esc(e.id)}">${esc(e.avatar)} ${esc(e.name)} <span class="muted">· ${esc(e.domain)}</span></button>`).join('');hint.style.display=matches.length?'block':'none'}
function showModal(title,html,ok='确认',onConfirm=null,danger=false){el('modalTitle').textContent=title;el('modalBody').innerHTML=html;el('modalConfirm').textContent=ok;el('modalConfirm').className='btn '+(danger?'danger':'primary');modalAction=onConfirm;el('modalBack').classList.add('open')}let modalAction=null;function closeModal(){el('modalBack').classList.remove('open');modalAction=null}
function showChannelModal(edit=false){const c=edit?getChan():null;if(edit&&!c)return;const members=c?c.members:enabled().map(e=>e.id);showModal(edit?'编辑讨论':'新建团队讨论',`<div class="field"><label>讨论名称 *</label><input id="channelNameInput" maxlength="32" value="${esc(c?.name||'')}" placeholder="例如：版本质量专项讨论"/></div><div class="field"><label>讨论目标 *</label><textarea id="channelDescInput" placeholder="明确讨论范围与目标">${esc(c?.description||'')}</textarea></div><div class="field"><label>参与的数字员工</label><div class="soft" style="display:grid;gap:11px">${state.employees.map(e=>`<label class="row" style="font-size:11px;cursor:pointer"><input type="checkbox" data-member-checkbox="${esc(e.id)}" ${members.includes(e.id)?'checked':''}/>${esc(e.avatar)} <b>${esc(e.name)}</b><span class="muted">${esc(e.domain)}</span></label>`).join('')||'尚无员工'}</div></div>`,edit?'保存讨论':'创建讨论',()=>{const name=el('channelNameInput').value.trim(),description=el('channelDescInput').value.trim();if(!name||!description){toast('请填写讨论名称和目标');return false}const ms=[...document.querySelectorAll('[data-member-checkbox]:checked')].map(x=>x.dataset.memberCheckbox);if(!ms.length){toast('至少选择一名员工');return false}if(c){Object.assign(c,{name,description,members:ms})}else{const n={id:'ch_'+Date.now().toString(36),name,description,members:ms,messages:[{who:'system',text:''}]};state.channels.unshift(n);state.currentChannel=n.id}save();renderTeam();toast('讨论已保存')})}
function showGroupExplanation(){const c=getChan();if(!c)return;const examples=c.members.map(getEmp).filter(x=>x&&x.enabled);const operations=examples.find(x=>x.id==='emp_operations')||examples[0];if(!operations){toast('频道没有可用员工');return}el('groupInput').value=`@${operations.name} 请分析版本资源变更导致的自动化失败，并联系其他相关员工一起判断。`;el('groupInput').focus();toast('已填入讨论内容')}
// event delegation
document.addEventListener('click',ev=>{const b=ev.target.closest('[data-nav],[data-select-employee],[data-toggle-employee],[data-edit-employee],[data-delete-employee],[data-chat-employee],[data-person],[data-channel],[data-private-prompt],[data-mention],[data-pick-mention],[data-person-tab],[data-select-private-thread]');if(!b)return;if(b.hasAttribute('data-nav'))navigate(b.dataset.nav);else if(b.hasAttribute('data-select-employee')){state.selectedEmployee=b.dataset.selectEmployee;save();renderManage()}else if(b.hasAttribute('data-edit-employee'))showDrawer(b.dataset.editEmployee);else if(b.hasAttribute('data-delete-employee'))deleteEmployee(b.dataset.deleteEmployee);else if(b.hasAttribute('data-chat-employee'))startPrivate(b.dataset.chatEmployee);else if(b.hasAttribute('data-person')){clearDraft('private');state.currentEmployee=b.dataset.person;save();renderChat()}else if(b.hasAttribute('data-channel')){clearDraft('group');state.currentChannel=b.dataset.channel;save();renderTeam()}else if(b.hasAttribute('data-private-prompt')){el('privateInput').value=b.dataset.privatePrompt;sendPrivate()}else if(b.hasAttribute('data-mention'))insertMention(b.dataset.mention);else if(b.hasAttribute('data-pick-mention')){const id=b.dataset.pickMention;const box=el('groupInput');box.value=box.value.replace(/(?:^|\s)@[^\s]*$/,'').trim();insertMention(id)}else if(b.hasAttribute('data-person-tab')){personTab=b.dataset.personTab;renderPersonAside()}else if(b.hasAttribute('data-select-private-thread')){clearDraft('private');state.activePrivateConversation[state.currentEmployee]=b.dataset.selectPrivateThread;closeThreadMenu();save();renderChat()}});
document.addEventListener('change',e=>{if(e.target.matches('[data-toggle-employee]'))toggleEmployee(e.target.dataset.toggleEmployee,e.target.checked)});
el('skillPickerTrigger').onclick=()=>{
  let p=el('skillPicker');let opened=p.classList.toggle('open');
  el('skillPickerTrigger').setAttribute('aria-expanded',String(opened));
  if(opened){renderSkillPicker();el('skillSearch').focus()}
};
el('skillSearch').oninput=renderSkillPicker;
el('skillOptions').addEventListener('change',e=>{
  if(e.target.matches('input[type="checkbox"]')){
    if(e.target.checked)selectedSkills.add(e.target.value);

el('skillSelected').addEventListener('click',e=>{
  const b=e.target.closest('[data-remove-skill]');

document.addEventListener('click',e=>{
  if(!el('skillPicker').contains(e.target))closeSkillPicker();
});
el('addEmployee').onclick=()=>showDrawer();el('employeeSearch').oninput=renderManage;el('drawerClose').onclick=closeDrawer;el('drawerCancel').onclick=closeDrawer;el('drawerOverlay').onclick=e=>{if(e.target===el('drawerOverlay'))closeDrawer()};el('saveEmployee').onclick=saveEmployee;el('employeeForm').onsubmit=e=>{e.preventDefault();saveEmployee()};el('privateSend').onclick=sendPrivate;el('privateInput').onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendPrivate()}};el('newPrivateChat').onclick=newPrivateChat;el('privateHistoryBtn').onclick=()=>{const menu=el('privateThreadMenu');const opened=menu.classList.toggle('open');el('privateHistoryBtn').setAttribute('aria-expanded',String(opened))};document.addEventListener('click',e=>{if(!el('threadPicker').contains(e.target))closeThreadMenu()});el('groupSend').onclick=sendGroup;el('groupInput').onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendGroup()}};el('groupInput').oninput=mentionHint;el('addChannel').onclick=()=>showChannelModal();el('channelSettings').onclick=()=>showChannelModal(true);el('editMembers').onclick=()=>showChannelModal(true);el('groupQuickTags').addEventListener('click',e=>{if(e.target.closest('#groupExplain'))showGroupExplanation()});el('modalClose').onclick=closeModal;el('modalCancel').onclick=closeModal;el('modalBack').onclick=e=>{if(e.target===el('modalBack'))closeModal()};el('modalConfirm').onclick=()=>{const r=modalAction?.();if(r!==false)closeModal()};document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeDrawer();closeModal();closeAttachmentViewer();el('mentionBox').style.display='none'}});el('resetDemo').onclick=()=>showModal('重置演示数据','<p>恢复三位员工、两个团队频道和预置交流内容。已在本地编辑的员工、频道和聊天记录将被清空。</p>','重置',()=>{state=defaults();save();navigate('manage');el('employeeSearch').value='';renderManage();toast('已重置')},true);
wireAttachmentControls();ensureThreadData();ensureSelection();navigate(['manage','chat','team'].includes(state.page)?state.page:'manage');
})();
